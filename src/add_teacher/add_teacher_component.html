<div class="teacher-shell">
    <div class="teacher-toolbar">
        <input type="button" value="exit" (click)="exit()">
        <input type="button" value="back" (click)="back()">
    </div>

    <div class="teacher-grid">
        <div class="teacher-form">
            <form>
                <table>
                    <tr>
                        <td>Teacher Id:</td>
                        <td>
                            <input type="number" name="tId" [(ngModel)]="tId" placeholder="Enter Teacher ID">
                        </td>
                    </tr>
                    <tr>
                        <td>Teacher Name:</td>
                        <td>
                            <input type="text" name="tName" [(ngModel)]="tName" placeholder="Enter Teacher name">
                        </td>
                    </tr>
                    <tr>
                        <td>Teacher Mobile number:</td>
                        <td>
                            <input type="text" name="tMobNum" [(ngModel)]="tMobNum" placeholder="Enter Teacher mobileNo">
                        </td>
                    </tr>
                    <tr>
                        <td>Teacher Email:</td>
                        <td>
                            <input type="text" name="tEmail" [(ngModel)]="tEmail" placeholder="Enter Teacher Email">
                        </td>
                    </tr>
                    <tr>
                        <td>Teacher Password:</td>
                        <td>
                            <input type="text" name="tPass" [(ngModel)]="tPass" placeholder="Enter Teacher Password">
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align: center;">
                            <input type="button" value="save" (click)="save()">
                        </td>
                    </tr>
                </table>
            </form>
        </div>

        <div class="teacher-table">
            <table>
                <tr>
                    <th>sr.no</th>
                    <th>T ID</th>
                    <th>T name</th>
                    <th>T Mob.no.</th>
                    <th>T Email</th>
                    <th>T password</th>
                </tr>
                @for (teacher of teachers; track teacher.tId) {
                <tr>
                    <td>{{$index+1}}</td>
                    <td>{{teacher.tId}}</td>
                    <td>{{teacher.tName}}</td>
                    <td>{{teacher.tMobNum}}</td>
                    <td>{{teacher.tEmail}}</td>
                    <td>{{teacher.tPass}}</td>
                </tr>
                }
            </table>
        </div>
    </div>
</div>
