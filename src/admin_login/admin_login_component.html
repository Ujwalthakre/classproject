@if(adminlog){
    <admin_panel (onExit)="handleExit()"></admin_panel>
}
@else if (teacherlog) {

}
@else if (studentlog) {

}
@else{
    <div class="login-shell">
        <form class="login-card">
            <table>
                <tr>
                    <td colspan="3">
                        <b>ADMIN LOGIN</b>
                    </td>
                </tr>
                <tr>
                    <td>
                        ID:
                    </td>
                    <td colspan="2">
                        <input type="text"
                        name="id"
                        placeholder="login"
                        [(ngModel)]="id"/>
                    </td>
                </tr>
                <tr>
                    <td>
                        PASSWORD:
                    </td>
                    <td colspan="2">
                        <input type="password"
                        name="password"
                        placeholder="Enter Password"
                        [(ngModel)]="password"/>
                    </td>
                </tr>
                <tr>
                    <td colspan="3" align="center">
                        <input type="button" value="login" (click)="login()" />
                        <input type="reset" value="clear"/>
                    </td>
                </tr>
            </table>
        </form>
    </div>
}
